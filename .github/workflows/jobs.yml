# Agenda dos jobs. /api/jobs/pedidos: expira Pix vencido, manda o lembrete do Pix 20 minutos
# depois do pedido e o lembrete de carrinho. /api/jobs/revisao: confere no Mercado Pago os saques
# em processamento e revisa as fotos presas em `processando`. O cron da Vercel no plano Hobby só
# roda uma vez por dia, então quem chama a cada 10 minutos é o GitHub Actions (grátis). O GitHub
# pode atrasar alguns minutos em horário de pico; o lembrete sai entre 20 e ~35 minutos.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   APP_URL      endereço do site, ex. https://www.clicouai.com
#   CRON_SECRET  o mesmo valor cadastrado na Vercel
name: Job de pedidos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# O job só chama o site com curl: o GITHUB_TOKEN não precisa de permissão nenhuma no repositório
# (menor privilégio; o repositório é público).
permissions: {}

jobs:
  pedidos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Chamar /api/jobs/pedidos
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Cadastre os segredos APP_URL e CRON_SECRET no repositório."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/jobs/pedidos"

      - name: Chamar /api/jobs/revisao
        # Roda mesmo se o job de pedidos falhar: um não depende do outro.
        if: ${{ !cancelled() }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Cadastre os segredos APP_URL e CRON_SECRET no repositório."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/jobs/revisao"
